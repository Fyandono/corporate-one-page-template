name: Nama Direktur Utama
group: director
order: 1
position:
  id: Direktur Utama
  en: President Director
bio:
  id: Menjabat sebagai Direktur Utama sejak 2023. Memimpin transformasi perusahaan dengan fokus pada pertumbuhan berkelanjutan dan tata kelola yang baik.
  en: Serving as President Director since 2023. Leading the company's transformation with a focus on sustainable growth and good governance.
photo: ../../assets/placeholders/portrait.svg
message:
  id: Amanah kami bukan sekadar mengelola aset negara, melainkan memastikan setiap rupiah yang dipercayakan kembali kepada masyarakat sebagai layanan yang lebih baik.
  en: Our mandate is not merely to manage state assets, but to ensure that every rupiah entrusted to us returns to the public as better service.
